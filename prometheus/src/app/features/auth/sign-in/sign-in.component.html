<section class="auth-shell">
  <div class="auth-panel">
    <div class="auth-brand">
      <div class="auth-brand__eyebrow">Prometheus access</div>
      <h1>Sign in</h1>
      <p>
        Enter the Prometheus operations desk. This app is the dedicated surface for live dispatch,
        matching, and direct broker-carrier execution.
      </p>
    </div>

    <form [formGroup]="signInForm" (ngSubmit)="submit()" class="auth-form">
      <label class="field">
        <span>Email or username</span>
        <input type="text" formControlName="email" placeholder="dispatch@company.com or superadmin" />
      </label>

      <label class="field">
        <span>Password</span>
        <input type="password" formControlName="password" placeholder="Enter your password" />
      </label>

      <label class="checkbox">
        <input type="checkbox" formControlName="rememberMe" />
        <span>Keep me signed in on this machine</span>
      </label>

      <div class="error" *ngIf="error">{{ error }}</div>

      <button class="primary-button" type="submit" [disabled]="loading">
        {{ loading ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <div class="auth-links">
      <span>Need a new company account?</span>
      <a routerLink="/sign-up">Start onboarding</a>
    </div>
  </div>
</section>
